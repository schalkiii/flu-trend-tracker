name: Update flu data

on:
  schedule:
    # 每周五 16:10 UTC = 北京时间周六 00:10（周报一般周四/周五发布）
    - cron: "10 16 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-flu-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser deps
        run: pip install pdfplumber

      - name: Fetch latest reports
        run: |
          # 单源失败不拖垮整轮: 记录退出码, 后置校验兜底(至少一源成功才继续)
          rc=0
          python scripts/fetch_cdc.py --pages 4 --weeks 80 || rc=1
          python scripts/fetch_multipathogen.py --pages 2 --weeks 12 || rc=1
          python scripts/fetch_notifiable.py || rc=1
          if [ "$rc" != 0 ]; then
            echo "::warning::部分数据源抓取失败, 本轮仅提交成功源的数据"
          fi

      - name: Verify data integrity
        run: python verify_page.py

      # 城市级百度指数无法在 CI 采集: 接口为 TLS 指纹级风控, 需本机浏览器(webbridge)实时取凭证。
      # 现役路线见 README「城市级数据采集」: bash scripts/run_browser_fetch.sh (本地手动运行)。

      - name: Commit and push if changed
        run: |
          git config user.name "flu-bot"
          git config user.email "actions@github.com"
          git add data/flu_national.json data/flu_cities.json data/flu_multipathogen.json data/flu_notifiable.json
          if git diff --cached --quiet; then
            echo "No data change, skip commit."
          else
            git commit -m "data: update flu weekly report ($(date -u +%F))"
            git push
          fi

  # Pages 部署验证: 数据 push 后轮询线上 JSON, 直到 meta.updated_at 与仓库一致。
  # 无数据变更时线上本就一致, 首轮即通过; 有变更时等待 Pages 部署完成(一般 1-2 分钟)。
  # Pages 部署失败/超时 => 本 job 显式报错, 而不是静默停留在旧数据。
  verify-pages:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages deploy and verify live data
        run: |
          expected=$(python -c "import json;print(json.load(open('data/flu_national.json'))['meta']['updated_at'])")
          url="https://schalkiii.github.io/flu-trend-tracker/data/flu_national.json"
          live=""
          for i in $(seq 1 30); do
            live=$(curl -fsSL "$url" | python -c "import json,sys;print(json.load(sys.stdin)['meta']['updated_at'])" 2>/dev/null || echo "")
            if [ -n "$live" ] && [ "$live" = "$expected" ]; then
              echo "Live site verified, data updated_at=$live"
              exit 0
            fi
            echo "Deploy not ready yet (attempt $i/30): live=$live expected=$expected"
            sleep 20
          done
          echo "::error::Pages 部署验证超时(10 分钟): 线上 data 仍为 '$live', 仓库为 '$expected'"
          exit 1
